<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadcn to Figma</title>
    <style>
        :root {
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            --primary: #18181b;
            --primary-foreground: #fafafa;
            --secondary: #f4f4f5;
            --secondary-foreground: #18181b;
            --muted: #f4f4f5;
            --muted-foreground: #71717a;
            --border: #e4e4e7;
            --input: #e4e4e7;
            --ring: #18181b;
            --radius: 0.5rem;
        }

        body {
            font-family: var(--font-family);
            margin: 0;
            padding: 16px;
            color: var(--primary);
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }

        h2 {
            font-size: 14px;
            font-weight: 600;
            margin: 0 0 8px 0;
        }

        p {
            font-size: 12px;
            color: var(--muted-foreground);
            margin: 0 0 16px 0;
            line-height: 1.5;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }

        button {
            background-color: var(--primary);
            color: var(--primary-foreground);
            border: none;
            padding: 10px 16px;
            border-radius: var(--radius);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        button.secondary {
            background-color: var(--secondary);
            color: var(--secondary-foreground);
        }

        /* Components header + view toggle */
        .components-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .components-header h2 {
            margin: 0;
        }

        .view-toggle {
            display: inline-flex;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .view-toggle button {
            background: transparent;
            color: var(--muted-foreground);
            border: none;
            padding: 5px 8px;
            border-radius: 0;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
        }

        .view-toggle button svg {
            width: 14px;
            height: 14px;
            display: block;
        }

        .view-toggle button.active {
            background: var(--primary);
            color: var(--primary-foreground);
        }

        /* Breadcrumb (inside a category) */
        .breadcrumb {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .back-btn,
        .link-btn {
            background: transparent;
            border: none;
            padding: 2px 0;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            color: var(--primary);
        }

        .link-btn {
            color: var(--muted-foreground);
        }

        .back-btn:hover,
        .link-btn:hover {
            opacity: 0.8;
        }

        .back-btn:disabled,
        .link-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Scrollable component / folder area */
        .component-area {
            flex: 1;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 8px;
            padding: 8px;
            box-sizing: border-box;
        }

        .component-area.view-card {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            align-content: start;
        }

        .component-area.view-list {
            display: flex;
            flex-direction: column;
            gap: 0;
            padding: 0;
        }

        .list-empty {
            padding: 16px 12px;
            font-size: 12px;
            color: var(--muted-foreground);
            grid-column: 1 / -1;
        }

        /* A tile (folder or component) — card mode */
        .tile {
            display: flex;
            flex-direction: column;
            gap: 8px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 10px;
            box-sizing: border-box;
        }

        .tile-top {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tile-icon {
            font-size: 15px;
            line-height: 1;
        }

        .tile-name {
            font-size: 12px;
            font-weight: 500;
            color: var(--primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tile-meta {
            font-size: 10px;
            color: var(--muted-foreground);
        }

        .folder.tile {
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s;
        }

        .folder.tile:hover {
            border-color: var(--ring);
            background: var(--secondary);
        }

        /* List mode: tiles collapse into compact rows */
        .view-list .tile {
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            border: none;
            border-bottom: 1px solid var(--border);
            border-radius: 0;
            padding: 8px 12px;
            gap: 8px;
        }

        .view-list .tile:last-child {
            border-bottom: none;
        }

        .view-list .tile-meta {
            margin-left: auto;
        }

        .view-list .folder.tile:hover {
            background: var(--secondary);
            border-color: transparent;
        }

        .add-btn {
            background: var(--secondary);
            color: var(--secondary-foreground);
            border: none;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            flex-shrink: 0;
        }

        .view-card .add-btn {
            width: 100%;
        }

        .add-btn:hover {
            opacity: 0.85;
        }

        .add-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .chevron {
            color: var(--muted-foreground);
            font-size: 14px;
            margin-left: auto;
        }

        .view-card .folder .chevron {
            display: none;
        }

        .resize-handle {
            position: fixed;
            right: 0;
            bottom: 0;
            width: 16px;
            height: 16px;
            cursor: nwse-resize;
            color: var(--border);
            z-index: 2000;
            touch-action: none;
        }

        .resize-handle:hover {
            color: var(--muted-foreground);
        }

        .resize-handle svg {
            display: block;
            width: 16px;
            height: 16px;
        }

        #status {
            margin-top: 8px;
            font-size: 11px;
            min-height: 16px;
            line-height: 1.4;
        }

        .success {
            color: #10b981;
        }

        .error {
            color: #ef4444;
        }

        .divider {
            height: 1px;
            background: var(--border);
            margin: 16px 0;
        }

        .footer {
            margin-top: auto;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        .footer-links {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px 16px;
        }

        .footer-links a {
            color: var(--muted-foreground);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
            position: relative;
            padding: 4px;
        }

        .footer-links a:hover {
            color: var(--primary);
        }

        .footer-links svg {
            width: 16px;
            height: 16px;
            display: block;
        }

        .creator-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--muted-foreground);
            text-decoration: none;
            font-size: 11px;
            font-weight: 500;
            padding: 4px;
            transition: color 0.2s;
        }

        .creator-link:hover {
            color: var(--primary);
        }

        .creator-avatar {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            flex-shrink: 0;
        }

        /* The creator link has its own visible text, so suppress the icon-style
           hover tooltip used by the other footer links. */
        .creator-link::before,
        .creator-link::after {
            content: none;
            display: none;
        }

        /* Custom tooltip styling */
        .footer-links a::before {
            content: attr(data-tooltip);
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--primary);
            color: var(--primary-foreground);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s, transform 0.2s;
            z-index: 1000;
        }

        .footer-links a::after {
            content: '';
            position: absolute;
            bottom: calc(100% + 2px);
            left: 50%;
            transform: translateX(-50%);
            border: 3px solid transparent;
            border-top-color: var(--primary);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s, transform 0.2s;
            z-index: 1000;
        }

        .footer-links a:hover::before,
        .footer-links a:hover::after {
            opacity: 1;
            transform: translateX(-50%) translateY(-2px);
        }
    </style>
</head>

        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor">
            <path d="M14 14H11L14 11V14ZM14 8L8 14H6L14 6V8Z"></path>
        </svg>

    <script>
        const generateBtn = document.getElementById('generateBtn');
        const generateComponentsBtn = document.getElementById('generateComponentsBtn');
        const componentArea = document.getElementById('componentArea');
        const componentsTitle = document.getElementById('componentsTitle');
        const componentsHint = document.getElementById('componentsHint');
        const breadcrumb = document.getElementById('breadcrumb');
        const backBtn = document.getElementById('backBtn');
        const addCategoryBtn = document.getElementById('addCategoryBtn');
        const cardViewBtn = document.getElementById('cardViewBtn');
        const listViewBtn = document.getElementById('listViewBtn');
        const status = document.getElementById('status');

        let isBusy = false;
        let groups = [];          // [{ tag, components: [] }]
        let currentTag = null;    // null = folder view; otherwise the open category
        let viewMode = 'card';    // 'card' | 'list'

        // Lock every button while a job runs so duplicate runs can't be queued.
        function setBusy(busy) {
            isBusy = busy;
            document.querySelectorAll('button').forEach(btn => {
                btn.disabled = busy;
            });
        }

        function send(message) {
            if (isBusy) return;
            setBusy(true);
            parent.postMessage({ pluginMessage: message }, '*');
        }

        // Turn "radio-group" into "Radio Group" for display.
        function prettify(name) {
            return name.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
        }

        generateBtn.onclick = () => send({ type: 'generate-variables', useDefault: true });
        generateComponentsBtn.onclick = () => send({ type: 'generate-components' });

        cardViewBtn.onclick = () => setView('card');
        listViewBtn.onclick = () => setView('list');

        function setView(mode) {
            viewMode = mode;
            cardViewBtn.classList.toggle('active', mode === 'card');
            listViewBtn.classList.toggle('active', mode === 'list');
            componentArea.classList.toggle('view-card', mode === 'card');
            componentArea.classList.toggle('view-list', mode === 'list');
            render();
        }

        backBtn.onclick = () => { currentTag = null; render(); };
        addCategoryBtn.onclick = () => { if (currentTag) send({ type: 'generate-category', tag: currentTag }); };

        // Render either the folder grid or the open category's components.
        function render() {
            componentArea.innerHTML = '';

            if (currentTag === null) {
                // --- Folder / category view ---
                componentsTitle.textContent = 'Components';
                breadcrumb.style.display = 'none';
                componentsHint.style.display = '';
                generateComponentsBtn.style.display = '';

                if (!groups.length) {
                    componentArea.innerHTML = '<div class="list-empty">Loading components…</div>';
                    return;
                }

                groups.forEach(group => {
                    const tile = document.createElement('div');
                    tile.className = 'folder tile';
                    tile.onclick = () => { currentTag = group.tag; render(); };

                    const top = document.createElement('div');
                    top.className = 'tile-top';
                    top.innerHTML = '<span class="tile-icon">📦</span>'
                        + '<span class="tile-name">' + group.tag + '</span>'
                        + '<span class="chevron">›</span>';

                    const meta = document.createElement('span');
                    meta.className = 'tile-meta';
                    meta.textContent = group.components.length
                        + (group.components.length === 1 ? ' component' : ' components');

                    tile.appendChild(top);
                    tile.appendChild(meta);
                    componentArea.appendChild(tile);
                });
            } else {
                // --- Inside a category ---
                const group = groups.find(g => g.tag === currentTag);
                componentsTitle.textContent = currentTag;
                breadcrumb.style.display = 'flex';
                componentsHint.style.display = 'none';
                generateComponentsBtn.style.display = 'none';

                if (!group) { componentArea.innerHTML = '<div class="list-empty">Empty.</div>'; return; }

                group.components.forEach(name => {
                    const tile = document.createElement('div');
                    tile.className = 'tile';

                    const nameEl = document.createElement('span');
                    nameEl.className = 'tile-name';
                    nameEl.textContent = prettify(name);

                    const btn = document.createElement('button');
                    btn.className = 'add-btn';
                    btn.textContent = 'Add';
                    btn.onclick = () => send({ type: 'generate-component', name });

                    tile.appendChild(nameEl);
                    tile.appendChild(btn);
                    componentArea.appendChild(tile);
                });
            }
        }

        window.onmessage = (event) => {
            const msg = event.data.pluginMessage;
            if (!msg) return;

            if (msg.type === 'component-list') {
                groups = msg.groups || [];
                render();
            } else if (msg.type === 'status') {
                showStatus(msg.message, msg.status);
                // Re-enable the UI once a job reaches a terminal state.
                if (msg.status === 'success' || msg.status === 'error') {
                    setBusy(false);
                }
            }
        };

        // Ask the plugin for the component catalog now that the UI is ready.
        parent.postMessage({ pluginMessage: { type: 'request-component-list' } }, '*');

        // --- Window resizing ---------------------------------------------------
        // The iframe fills the plugin window, so the pointer's viewport
        // coordinates equal the desired window size. Drag the corner handle to
        // resize; the plugin clamps to a minimum and persists the size.
        const resizeHandle = document.getElementById('resizeHandle');
        let resizing = false;

        resizeHandle.onpointerdown = (e) => {
            resizing = true;
            resizeHandle.setPointerCapture(e.pointerId);
            e.preventDefault();
        };

        resizeHandle.onpointermove = (e) => {
            if (!resizing) return;
            const width = Math.max(320, Math.ceil(e.clientX + 4));
            const height = Math.max(400, Math.ceil(e.clientY + 4));
            parent.postMessage({ pluginMessage: { type: 'resize', width, height } }, '*');
        };

        resizeHandle.onpointerup = (e) => {
            resizing = false;
            resizeHandle.releasePointerCapture(e.pointerId);
        };

        function showStatus(message, type) {
            status.textContent = message;
            status.className = type;
        }
    </script>
